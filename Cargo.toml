[package]
name = "clonewatch"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Find fake repos impersonating your GitHub project: non-fork clones that share your git blobs and add archives or executables"
license = "MIT"
repository = "https://github.com/majiayu000/clonewatch"
homepage = "https://github.com/majiayu000/clonewatch"
readme = "README.md"
keywords = ["github", "security", "malware", "impersonation", "maintainer"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["examples/*.json"]

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "3", features = ["json"] }
